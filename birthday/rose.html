<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌹 Rose Blooming from Code</title>
    <meta name="description" content="A single div transforms into a beautiful blooming 3D rose.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@500;700&family=Fira+Code:wght@500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@500;700&family=Fira+Code:wght@500&family=Bangers&display=swap"
    rel="stylesheet">
   <style>
    *,
*::before,
*::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
}

body {
    background: #0a0a0a;
    background: radial-gradient(ellipse at 50% 75%, #1a0505 0%, #0a0a0a 55%, #050505 100%);
    display: flex;
    align-items: center;
    justify-content: center;
}

.vignette {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 35%, rgba(0, 0, 0, 0.6) 100%);
    z-index: 100;
    pointer-events: none;
}

.spotlight {
    position: fixed;
    top: 35%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 85vw;
    height: 85vh;
    background: radial-gradient(circle, rgba(232, 24, 27, 0.12) 0%, transparent 70%);
    filter: blur(50px);
    pointer-events: none;
    z-index: 1;
}

.trigger-overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(10, 10, 10, 0.9);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    z-index: 200;
    opacity: 1;
    transition: opacity 0.8s cubic-bezier(0.25, 1, 0.5, 1), visibility 0.8s;
    visibility: visible;
}

.glass-card {
    position: relative;
    width: min(85vw, 340px);
    background: linear-gradient(160deg, #171717, #360808);
    border: 1px solid rgba(232, 24, 27, 0.35);
    border-radius: 24px;
    padding: 35px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.6),
        0 0 40px rgba(232, 24, 27, 0.2);
    transform: scale(1);
    transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    overflow: hidden;
}

.card-glow {
    position: absolute;
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(27, 58, 140, 0.30) 0%, transparent 70%);
    top: -40px;
    left: -40px;
    filter: blur(15px);
    pointer-events: none;
}

.glass-card .title {
    color: #ffffff;
    font-family: 'Bangers', cursive;
    font-size: 30px;
    font-weight: 400;
    letter-spacing: 2px;
    margin-bottom: 22px;
    text-shadow: 3px 3px 0 #E8181B, 5px 5px 0 #1B3A8C;
}

.loading-bar-container {
    width: 100%;
    height: 6px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 10px;
}

.loading-bar {
    width: 0%;
    height: 100%;
    background: linear-gradient(to right, #E8181B, #1B3A8C);
    border-radius: 3px;
    transition: width 0.1s linear;
}

.status-text {
    font-size: 12px;
    color: #cfcfcf;
    font-family: 'Fira Code', monospace;
    margin-bottom: 26px;
}

.start-button {
    position: relative;
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #E8181B 0%, #8f0f12 100%);
    border: none;
    border-radius: 12px;
    color: #ffffff;
    font-family: 'Bangers', cursive;
    font-weight: 400;
    font-size: 16px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    cursor: pointer;
    overflow: hidden;
    transition: transform 0.2s, box-shadow 0.2s, opacity 0.3s;
    box-shadow: 0 5px 20px rgba(232, 24, 27, 0.45);
}

.start-button:disabled {
    background: rgba(255, 255, 255, 0.06);
    color: rgba(255, 255, 255, 0.25);
    cursor: not-allowed;
    box-shadow: none;
    transform: none !important;
}

.start-button:not(:disabled):hover {
    transform: translateY(-2px);
    box-shadow:
        0 8px 25px rgba(232, 24, 27, 0.55),
        0 0 15px rgba(27, 58, 140, 0.5);
}

.ambient-light {
    position: fixed;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(232, 24, 27, 0.14) 0%, rgba(27, 58, 140, 0.08) 40%, transparent 65%);
    top: 32%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 5;
    pointer-events: none;
    opacity: 0;
    transition: opacity 3s ease;
}
.ambient-light.visible {
    opacity: 1;
}



.scene {
    position: fixed;
    inset: 0;
    perspective: 1200px;
    perspective-origin: 50% 35%;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-bottom: 6vh;
    z-index: 20;
    transform: scale(0.95);
}

.rose-wrapper {
    transform-style: preserve-3d;
    position: relative;
    width: 300px;
    height: 480px;
    transform: rotateX(-22deg) rotateY(0deg);
    will-change: transform;
}

.rose-wrapper.rotating {
    animation: rotateRose 28s linear infinite;
}

@keyframes rotateRose {
    from {
        transform: rotateX(-22deg) rotateY(0deg);
    }

    to {
        transform: rotateX(-22deg) rotateY(360deg);
    }
}


.stem-group {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 10px;
    height: 250px;
    transform-style: preserve-3d;
}

.stem {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 0%;
    background: linear-gradient(to top, #092e12 0%, #114c23 30%, #1a6f35 70%, #114c23 100%);
    border-radius: 5px;
    transition: height 2.2s cubic-bezier(0.22, 1, 0.36, 1);
    overflow: hidden;
    will-change: height;
}

.stem.grow {
    height: 100%;
}

.stem-highlight {
    position: absolute;
    top: 0;
    left: 1px;
    width: 2.5px;
    height: 100%;
    background: linear-gradient(to bottom, transparent, rgba(150, 255, 180, 0.15), transparent);
}

.thorn {
    position: absolute;
    width: 11px;
    height: 6px;
    opacity: 0;
    transition: opacity 0.5s ease 0.4s;
    z-index: 2;
}

.thorn::before {
    content: '';
    position: absolute;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #1a6f35, #092e12);
    clip-path: polygon(0% 85%, 100% 50%, 30% 0%);
}

.thorn-1 {
    right: -9px;
    bottom: 65%;
    transform: scaleX(-1);
}

.thorn-2 {
    left: -9px;
    bottom: 42%;
}

.stem.grow~.thorn {
    opacity: 0.75;
}

.leaf {
    position: absolute;
    width: 52px;
    height: 25px;
    opacity: 0;
    transition: opacity 0.6s ease, transform 1.1s cubic-bezier(0.34, 1.45, 0.64, 1);
    z-index: 2;
    will-change: transform, opacity;
}

.leaf::before {
    content: '';
    position: absolute;
    width: 100%;
    height: 100%;
    background: linear-gradient(160deg, #2a944e 0%, #1a6f35 40%, #092e12 100%);
    border-radius: 2px 65% 2px 65%;
}

.leaf-vein {
    position: absolute;
    width: 60%;
    height: 1px;
    background: rgba(150, 255, 180, 0.12);
    top: 48%;
    left: 20%;
    z-index: 1;
}

.leaf-left {
    left: -52px;
    bottom: 56%;
    transform-origin: right center;
    transform: rotate(35deg) scale(0);
}

.leaf-left::before {
    border-radius: 65% 2px 65% 2px;
}

.leaf-right {
    left: 10px;
    bottom: 38%;
    transform-origin: left center;
    transform: rotate(-35deg) scale(0);
}

.leaf-right::before {
    border-radius: 2px 65% 2px 65%;
}

.leaf.visible {
    opacity: 1;
}

.leaf-left.visible {
    transform: rotate(15deg) scale(1);
}

.leaf-right.visible {
    transform: rotate(-15deg) scale(1);
}


.calyx {
    position: absolute;
    bottom: 242px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    transform-style: preserve-3d;
    z-index: 1;
}

.sepal {
    position: absolute;
    bottom: -4px;
    left: 50%;
    width: 14px;
    height: 32px;
    transform-origin: 50% 100%;
    background: linear-gradient(to top, #092e12 0%, #15582b 40%, #299c4c 100%);
    border-radius: 50% 50% 10% 10% / 80% 80% 20% 20%;
    clip-path: polygon(10% 100%, 0% 30%, 50% 0%, 100% 30%, 90% 100%);
    opacity: 0;
    transform: translateX(-50%) rotateY(var(--sepal-angle, 0deg)) rotateX(60deg) scale(0.5);
    transition:
        transform 1.3s cubic-bezier(0.25, 1, 0.5, 1) var(--sepal-delay, 0s),
        opacity 0.5s ease var(--sepal-delay, 0s);
    will-change: transform, opacity;
}

.calyx.visible .sepal {
    opacity: 0.95;
    transform: translateX(-50%) rotateY(var(--sepal-angle, 0deg)) rotateX(var(--sepal-curl, 22deg)) scale(1);
}


.rose-glow {
    position: absolute;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(232, 24, 27, 0.18) 0%, rgba(27, 58, 140, 0.10) 45%, transparent 65%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    opacity: 0;
    transition: opacity 3.5s ease;
    z-index: -1;
    pointer-events: none;
}

.rose-glow-inner {
    position: absolute;
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 255, 255, 0.20) 0%, transparent 65%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    opacity: 0;
    transition: opacity 2s ease 0.8s;
    z-index: -1;
    pointer-events: none;
}

.rose-head.blooming .rose-glow {
    opacity: 1;
}

.rose-head.blooming .rose-glow-inner {
    opacity: 1;
}


.petal {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform-origin: 50% 100%;
    opacity: 0.002;
    will-change: transform, opacity;

    border-radius: 50% 50% 35% 35% / 45% 45% 55% 55%;

    transform:
        translateX(-50%) rotateY(var(--angle, 0deg)) translateZ(0px) rotateX(90deg) scale(0.1);

    transition:
        transform var(--bloom-dur, 2.4s) ease-in-out var(--delay, 0s),
        opacity 0.7s ease var(--delay, 0s);
}

.rose-head.blooming .petal {
    opacity: 1;
    transform:
        translateX(-50%) rotateY(var(--angle, 0deg)) translateZ(var(--tz, 0px)) rotateX(var(--curl, 30deg)) scale(var(--scale, 1));
}


.petal-bud {
    background: linear-gradient(to bottom, #ffffff 0%, #f0e6d2 40%, #d9c7a3 75%, #b8a279 100%);
}

.petal-core {
    background: linear-gradient(to bottom, #fdf8f0 0%, #ecdfc4 40%, #cdb78e 75%, #a68c5f 100%);
}

.petal-inner {
    background: linear-gradient(to bottom, #fbf4e6 0%, #e8d8b8 40%, #c3aa7f 75%, #967b4d 100%);
}

.petal-mid-inner {
    background: linear-gradient(to bottom, #f9efdb 0%, #e3d0aa 40%, #b89e70 75%, #856a3f 100%);
}

.petal-mid {
    background: linear-gradient(to bottom, #f6ead0 0%, #ddc79c 40%, #ad9362 75%, #745a32 100%);
}

.petal-outer {
    background: linear-gradient(to bottom, #f3e4c4 0%, #d6bd8e 40%, #a08854 75%, #634a26 100%);
}

.petal-blush {
    background: linear-gradient(to bottom, #f0dfb8 0%, #cfb480 40%, #937c46 75%, #52401c 100%);
}

.falling-petal {
    position: fixed;
    width: var(--fp-w, 13px);
    height: var(--fp-h, 17px);
    background: radial-gradient(ellipse at 40% 30%, var(--fp-c1, #fdf8ee), var(--fp-c2, #d9c7a3) 75%);
    border-radius: 50% 50% 45% 55% / 60% 60% 40% 40%;
    opacity: 0;
    pointer-events: none;
    z-index: 50;
    animation: fallSway var(--f-dur, 7s) linear forwards;
    animation-delay: var(--f-delay, 0s);
    will-change: transform, opacity;
}

@keyframes fallSway {
    0% {
        opacity: 0;
        transform: translateX(0) translateY(0) rotate(0deg) rotateY(0deg) scale(1);
    }

    8% {
        opacity: 0.85;
    }

    25% {
        transform: translateX(var(--s1, 35px)) translateY(20vh) rotate(70deg) rotateY(40deg) scale(0.95);
    }

    50% {
        transform: translateX(var(--s2, -25px)) translateY(48vh) rotate(160deg) rotateY(90deg) scale(0.88);
    }

    75% {
        transform: translateX(var(--s3, 35px)) translateY(75vh) rotate(270deg) rotateY(150deg) scale(0.78);
        opacity: 0.55;
    }

    100% {
        opacity: 0;
        transform: translateX(var(--s4, 10px)) translateY(108vh) rotate(390deg) rotateY(210deg) scale(0.55);
    }
}


.end-text {
    position: fixed;
    bottom: 8%;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    opacity: 0;
    transition: opacity 2s ease;
    z-index: 60;
}

.end-text.visible {
    opacity: 1;
}

.tagline {
    font-family: 'Bangers', cursive;
    font-style: normal;
    font-size: clamp(22px, 6vw, 34px);
    color: #ffffff;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-shadow:
        3px 3px 0 #E8181B,
        5px 5px 0 #1B3A8C;
    margin-bottom: 8px;
}

.rose-emoji {
    font-family: "Caveat", cursive;
    font-size: 1.3rem;
    font-style: italic;
    color: #f3eeee;
    letter-spacing: 0.5px;
}

@keyframes floatEmoji {

    0%,
    100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-8px);
    }
}


@media (max-width: 480px) {
    .rose-wrapper {
        transform: scale(0.82);
    }

    .tagline {
        letter-spacing: 2px;
    }
}

@media (max-height: 600px) {
    .rose-wrapper {
        transform: scale(0.68);
    }

    .end-text {
        bottom: 3%;
    }
}

.continue-container {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 3%;
    z-index: 70;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    opacity: 0;
    transition: opacity 1s ease;
}

.continue-container.show {
    opacity: 1;
}


.rose-emoji{
    font-family: "Cormorant Garamond", serif;
    font-size: 2rem;
    font-style: italic;
    color: #4d2326;
    letter-spacing: 1px;
}

.trigger-overlay.fade-out {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.trigger-overlay.fade-out .glass-card {
    transform: scale(0.85);
}

.rose-head {
    position: absolute;
    bottom: 245px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    transform-style: preserve-3d;
    z-index: 10;
}

</style>
</head>

<body>
    <div class="vignette"></div>


    <div class="spotlight"></div>
    <div class="ambient-light" id="ambientLight"></div>

    <div class="trigger-overlay" id="triggerOverlay">
        <div class="glass-card">
            <div class="card-glow"></div>
            <div class="rose-icon">🌹</div>
            <h2 class="title">for you, love.</h2>
            <div class="loading-bar-container">
                <div class="loading-bar" id="loadingBar"></div>
            </div>
            <p class="status-text" id="statusText">Ready to compile...</p>
            <button class="start-button" id="startButton" disabled>
                <span class="btn-text">let it bloom</span>
                <span class="btn-shine"></span>
            </button>
        </div>
    </div>

    <div class="scene">
        <div class="rose-wrapper" id="roseWrapper">
            <div class="stem-group">
                <div class="stem" id="stem">
                    <div class="stem-highlight"></div>
                </div>
                <div class="thorn thorn-1" id="thorn1"></div>
                <div class="thorn thorn-2" id="thorn2"></div>
                <div class="leaf leaf-left" id="leafLeft">
                    <div class="leaf-vein"></div>
                </div>
                <div class="leaf leaf-right" id="leafRight">
                    <div class="leaf-vein"></div>
                </div>
            </div>

            <div class="calyx" id="calyx"></div>

            <div class="rose-head" id="roseHead">
                <div class="rose-glow"></div>
                <div class="rose-glow-inner"></div>
            </div>
        </div>
    </div>

    <div class="end-text" id="endText">
        <p class="tagline" id="tagline"></p>
        <span class="rose-emoji">this rose is beautiful but you are more.
            i could write a thousand things but none of them are privileged enough to describe you.
        </span>
    </div>

    <div id="fallingPetals"></div>

    <script src="script.js"></script>
</body>

<script>
    document.addEventListener('DOMContentLoaded', () => {

    const triggerOverlay = document.getElementById('triggerOverlay');
    const startButton = document.getElementById('startButton');
    const loadingBar = document.getElementById('loadingBar');
    const statusText = document.getElementById('statusText');
    const ambientLight = document.getElementById('ambientLight');
    const roseWrapper = document.getElementById('roseWrapper');
    const roseHead = document.getElementById('roseHead');
    const calyx = document.getElementById('calyx');
    const stem = document.getElementById('stem');
    const leafLeft = document.getElementById('leafLeft');
    const leafRight = document.getElementById('leafRight');
    const endText = document.getElementById('endText');
    const fallingPetalsEl = document.getElementById('fallingPetals');
    const scene = document.querySelector('.scene');

    const PETAL_LAYERS = [
        { count: 4, w: 24, h: 46, curl: 78, delayBase: 0, tz: 2, cls: 'petal-bud' },
        { count: 5, w: 34, h: 58, curl: 65, delayBase: 0.25, tz: 9, cls: 'petal-core' },
        { count: 6, w: 46, h: 72, curl: 48, delayBase: 0.55, tz: 18, cls: 'petal-inner' },
        { count: 7, w: 58, h: 88, curl: 22, delayBase: 0.90, tz: 30, cls: 'petal-mid-inner' },
        { count: 8, w: 72, h: 104, curl: -5, delayBase: 1.30, tz: 44, cls: 'petal-mid' },
        { count: 9, w: 86, h: 118, curl: -25, delayBase: 1.75, tz: 60, cls: 'petal-outer' },
        { count: 10, w: 98, h: 130, curl: -48, delayBase: 2.25, tz: 76, cls: 'petal-blush' },
    ];

    const SEPALS_COUNT = 5;

    const FALLING_PETAL_COLORS = [
        ['#9a001d', '#3d0008'],
        ['#850018', '#2b0005'],
        ['#ad0022', '#480008'],
        ['#bf0028', '#52000c'],
    ];

    let fallingPetalInterval = null;


    function startCardLoader() {
        const duration = 2400;
        const steps = [
            { threshold: 20, text: 'Loading...' },
            { threshold: 50, text: 'Growing digital petals...' },
            { threshold: 80, text: 'Adding velvet textures...' },
            { threshold: 95, text: 'Optimizing 3D rendering...' },
            { threshold: 100, text: 'Ready to bloom!' }
        ];

        let startTimestamp = null;

        function animateLoader(timestamp) {
            if (!startTimestamp) startTimestamp = timestamp;
            const progress = Math.min((timestamp - startTimestamp) / duration, 1);
            const percent = Math.floor(progress * 100);

            loadingBar.style.width = `${percent}%`;
            const activeStep = steps.find(s => percent <= s.threshold) || steps[steps.length - 1];
            statusText.textContent = activeStep.text;

            if (progress < 1) {
                requestAnimationFrame(animateLoader);
            } else {
                startButton.removeAttribute('disabled');
            }
        }

        requestAnimationFrame(animateLoader);
    }


    function createSepals() {
        const step = 360 / SEPALS_COUNT;
        for (let i = 0; i < SEPALS_COUNT; i++) {
            const sepal = document.createElement('div');
            sepal.className = 'sepal';
            const angle = i * step + (Math.random() - 0.5) * 5;
            const delay = 0.3 + i * 0.06;
            const curl = 18 + Math.random() * 8;

            sepal.style.setProperty('--sepal-angle', `${angle}deg`);
            sepal.style.setProperty('--sepal-curl', `${curl}deg`);
            sepal.style.setProperty('--sepal-delay', `${delay}s`);
            calyx.appendChild(sepal);
        }
    }

    function createPetals() {
        PETAL_LAYERS.forEach((layer, li) => {
            const angleStep = 360 / layer.count;
            const layerOffset = li * 24 + (Math.random() - 0.5) * 8;

            for (let i = 0; i < layer.count; i++) {
                const petal = document.createElement('div');
                petal.className = `petal ${layer.cls}`;

                const angle = layerOffset + i * angleStep + (Math.random() - 0.5) * 5;
                const delay = layer.delayBase + i * 0.05;
                const curlJitter = (Math.random() - 0.5) * 6;
                const scaleJitter = 0.94 + Math.random() * 0.12;
                const bloomDur = 2.1 + Math.random() * 0.4;

                petal.style.width = `${layer.w}px`;
                petal.style.height = `${layer.h}px`;
                petal.style.setProperty('--angle', `${angle}deg`);
                petal.style.setProperty('--curl', `${layer.curl + curlJitter}deg`);
                petal.style.setProperty('--scale', scaleJitter);
                petal.style.setProperty('--delay', `${delay}s`);
                petal.style.setProperty('--tz', `${layer.tz}px`);
                petal.style.setProperty('--bloom-dur', `${bloomDur}s`);

                roseHead.appendChild(petal);
            }
        });
    }

    function growStem() {
        return new Promise(resolve => {
            stem.classList.add('grow');

            setTimeout(() => {
                leafLeft.classList.add('visible');
            }, 800);

            setTimeout(() => {
                leafRight.classList.add('visible');
            }, 1100);

            setTimeout(resolve, 2200);
        });
    }

    function bloom() {
        calyx.classList.add('visible');
        ambientLight.classList.add('visible');
        roseHead.classList.add('blooming');
    }

    function spawnFallingPetal() {
        if (fallingPetalsEl.childElementCount > 10) return;

        const petal = document.createElement('div');
        petal.className = 'falling-petal';

        const w = 10 + Math.random() * 12;
        const h = w * (1.25 + Math.random() * 0.15);
        const x = 20 + Math.random() * 60;
        const y = 3 + Math.random() * 10;
        const dur = 5.5 + Math.random() * 3.5;
        const delay = Math.random() * 0.6;

        const colors = FALLING_PETAL_COLORS[Math.floor(Math.random() * FALLING_PETAL_COLORS.length)];

        const sign = () => (Math.random() > 0.5 ? 1 : -1);
        const s1 = sign() * (15 + Math.random() * 25);
        const s2 = sign() * (10 + Math.random() * 20);
        const s3 = sign() * (20 + Math.random() * 30);
        const s4 = sign() * (10 + Math.random() * 15);

        petal.style.left = `${x}vw`;
        petal.style.top = `${y}vh`;
        petal.style.setProperty('--fp-w', `${w}px`);
        petal.style.setProperty('--fp-h', `${h}px`);
        petal.style.setProperty('--fp-c1', colors[0]);
        petal.style.setProperty('--fp-c2', colors[1]);
        petal.style.setProperty('--f-dur', `${dur}s`);
        petal.style.setProperty('--f-delay', `${delay}s`);
        petal.style.setProperty('--s1', `${s1}px`);
        petal.style.setProperty('--s2', `${s2}px`);
        petal.style.setProperty('--s3', `${s3}px`);
        petal.style.setProperty('--s4', `${s4}px`);

        fallingPetalsEl.appendChild(petal);

        setTimeout(() => {
            if (petal.parentNode) petal.remove();
        }, (dur + delay) * 1000 + 300);
    }

    function startFallingPetals() {
        for (let i = 0; i < 3; i++) {
            setTimeout(() => spawnFallingPetal(), i * 300);
        }

        fallingPetalInterval = setInterval(() => {
            spawnFallingPetal();
        }, 2200);
    }


    async function startAnimationSequence() {
        await growStem();
        await delay(100);
        bloom();

        setTimeout(() => {
            roseWrapper.classList.add('rotating');
        }, 2600);

        setTimeout(() => startFallingPetals(), 3400);

        setTimeout(() => {
            endText.classList.add('visible');
                document.querySelector('.continue-container').classList.add('show');

        }, 4600);
    }

    function delay(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    startButton.addEventListener('click', () => {
        triggerOverlay.classList.add('fade-out');

        setTimeout(() => {
            startAnimationSequence();
        }, 800);
    });
    createSepals();
    createPetals();

    setTimeout(() => {
        startCardLoader();
    }, 400);

});
</script>

</html>
