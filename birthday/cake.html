<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spider-Man Birthday Cake</title>

<style>
body{
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:linear-gradient(#0a0a1f,#1a0033);
    overflow:hidden;
    font-family:Arial,sans-serif;
    position:relative;
}

/* Background web pattern */
body::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: 
        radial-gradient(circle, rgba(255,255,255,0.08) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    opacity: 0.6;
}

.cake{
    position:relative;
    width:240px;
    height:190px;
}

.layer{
    position:absolute;
    left:0;
    width:240px;
    border-radius:20px;
    box-shadow: 
        inset 0 10px 20px rgba(0,0,0,0.4),
        0 15px 30px rgba(0,0,0,0.6);
}

/* Spider-Man themed cake layers */
.bottom{
    height:75px;
    bottom:0;
    background:linear-gradient(#e60000, #c40000);
    border: 8px solid #001f3f;
}

.middle{
    width:200px;
    height:60px;
    left:20px;
    bottom:65px;
    background:linear-gradient(#001f3f, #003399);
    border: 8px solid #e60000;
}

.top{
    width:160px;
    height:50px;
    left:40px;
    bottom:115px;
    background:linear-gradient(#e60000, #c40000);
    border: 8px solid #001f3f;
}

/* Web pattern on cake */
.layer::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: 
        linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.25) 42%, transparent 44%),
        linear-gradient(-45deg, transparent 40%, rgba(255,255,255,0.25) 42%, transparent 44%);
    background-size: 25px 25px;
    border-radius: 20px;
    pointer-events: none;
    opacity: 0.6;
}

.candle{
    position:absolute;
    width:12px;
    height:52px;
    background:linear-gradient(#111, #333);
    top:15px;
    border-radius:4px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.5);
    z-index: 5;
}

/* Fixed candle positions - centered nicely on top layer */
.c1{left:68px;}
.c2{left:118px;}
.c3{left:168px;}

.flame{
    position:absolute;
    width:16px;
    height:24px;
    background:linear-gradient(#ffcc00, #ff6600);
    border-radius:50% 50% 50% 50%;
    left:-2px;
    top:-20px;
    animation:flicker .15s infinite alternate;
    box-shadow:0 0 25px #ffcc00, 0 0 40px #ff8800;
}

@keyframes flicker{
    from{transform:scale(1) rotate(-5deg);}
    to{transform:scale(0.85) rotate(8deg);}
}

/* Smoke */
.smoke{
    position:absolute;
    width:14px;
    height:14px;
    border-radius:50%;
    background:rgba(220,220,220,0.75);
    top:-18px;
    left:-1px;
    opacity:0;
}

.blow .flame{
    display:none;
}

.blow .smoke{
    animation:smoke 2.2s forwards;
}

@keyframes smoke{
    0%{
        opacity:0.9;
        transform:translateY(0) scale(0.6);
    }
    100%{
        opacity:0;
        transform:translateY(-65px) scale(2.8);
    }
}

/* Title */
h1 {
    position: absolute;
    top: 30px;
    color: #ffcc00;
    text-shadow: 
        0 0 10px #e60000,
        0 0 20px #001f3f;
    font-size: 2.2rem;
    letter-spacing: 3px;
    text-align: center;
    width: 100%;
    font-family: 'Impact', sans-serif;
}

.birthday-bubble{
    position:fixed;
    bottom:-80px;
    padding:12px 22px;
    border-radius:999px;

    background:rgba(255,255,255,.12);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);

    border:1px solid rgba(255,255,255,.18);

    color:#fff;
    font-family:"Bangers", cursive;
    font-size:1.2rem;
    letter-spacing:1px;

    white-space:nowrap;
    pointer-events:none;
    z-index:999;

    animation:floatBubble 5s linear forwards;
}

@keyframes floatBubble{
    0%{
        transform:translateY(0) scale(.7);
        opacity:0;
    }

    10%{
        opacity:1;
    }

    100%{
        transform:
            translateY(-120vh)
            translateX(var(--drift));
        opacity:0;
    }
}

h1 {
    position: absolute;
    top: 30px;
    color: #ffcc00;
    text-shadow: 
        0 0 10px #e60000,
        0 0 20px #001f3f;
    font-size: 2.2rem;
    letter-spacing: 3px;
    text-align: center;
    width: 100%;
    font-family: 'Impact', sans-serif;
    transition: opacity 1.2s ease, transform 1.2s ease;
}

h1.fade-out {
    opacity: 0;
    transform: translateY(-20px);
}



</style>
</head>
<body>

<h1>Make a Wish</h1>

<div class="cake">

    <div class="layer bottom"></div>
    <div class="layer middle"></div>
    <div class="layer top"></div>

    <div class="candle c1">
        <div class="flame"></div>
        <div class="smoke"></div>
    </div>

    <div class="candle c2">
        <div class="flame"></div>
        <div class="smoke"></div>
    </div>

    <div class="candle c3">
        <div class="flame"></div>
        <div class="smoke"></div>
    </div>

</div>

<script>
setTimeout(() => {
    document.querySelectorAll(".candle").forEach(c => {
        c.classList.add("blow");
    });
        document.querySelector("h1").classList.add("fade-out");


    birthdayExplosion();

}, 4800);

function birthdayExplosion(){

    const wishes=[
        "Happy Birthday",
        "KISSES AND HUGS",
        "Stay Happy",
        "xoxo",
        "love you",
        "Have The Best Year",
        "EAT A LOT OF CAKES AND GET FAT"
    ];

    let delay = 0;
    for(let i = 0; i < 12; i++){


        setTimeout(()=>{

            const bubble=document.createElement("div");
            bubble.className="birthday-bubble";

            bubble.textContent=wishes[Math.floor(Math.random()*wishes.length)];

            bubble.style.left=(10+Math.random()*75)+"vw";
            bubble.style.setProperty(
                "--drift",
                (Math.random()*120-60)+"px"
            );

            bubble.style.animationDuration=
                (4+Math.random()*2)+"s";

            document.body.appendChild(bubble);

            bubble.addEventListener("animationend",()=>{
                bubble.remove();
            });

        },delay);

        delay+=450;
    }

}
</script>

</body>
</html>
